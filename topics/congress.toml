# Bills Congress has voted on, what each would change in the Congressional Research
# Service's words, and how close the votes were and how the parties split.

id = "congress"
title = "Bills that split Congress"
since = 2025-01-03
description = """
Every bill the House has voted on this Congress: what it would change in the Congressional
Research Service's words, how close the votes were, how each representative voted, and
which party's votes passed the spending bills.
"""

[congress_bills]
congress = 119

[site]
order = 1
tab = "Bills"
view = "congress"
headline = "Bills that split Congress"
lede = """What Congress has voted on this term and what each bill would actually change, \
in the nonpartisan Congressional Research Service's summary, with how close each vote was \
how each representative voted, and which party's votes carried the spending bills."""

[[site.panels]]
kind = "contested_bills"
title = "Contested bills, and what they would change"

[[site.panels]]
kind = "member_votes"
title = "How each representative voted"

[[site.panels]]
kind = "spending_laws"
title = "Who passed the spending bills"

[[site.filters]]
label = "All"

[site.ask]
examples = [
  "Which bills passed the House by fewer than ten votes this Congress, and what do they do?",
  "Which contested bills are still waiting for a Senate vote?",
  "What would the most recent party-line bill change, according to its CRS summary?",
]
