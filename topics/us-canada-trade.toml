# US–Canada trade and tariffs.
#
# Each table below is handed to the adapter of the same name. Tune queries freely:
# a too-broad query just means more documents to review, a too-narrow one means
# missed history. When in doubt, err broad and say why in the PR.

id = "us-canada-trade"
title = "US–Canada trade and tariffs"
since = 2025-01-01
description = """
Every official US and Canadian action on tariffs and trade between the two countries
since January 2025, what each government said about them, and what the official
trade figures did afterwards.
"""

[federal_register]
# Federal Register full-text search. `types`: PRESDOCU (executive orders, proclamations,
# memoranda), RULE, PRORULE, NOTICE. `agencies` uses federalregister.gov agency slugs.
queries = [
  { term = "Canada tariff", types = ["PRESDOCU"] },
  { term = "Canada tariff", types = ["RULE"] },
  { term = "Canada", agencies = ["trade-representative-office-of-united-states"] },
]

[canada_news]
# Government of Canada news API. Department slugs as used by api.io.canada.ca.
departments = ["departmentfinance", "departmentofforeignaffairstradeanddevelopment"]
# A release is kept if a word in its title or teaser starts with any of these
# (case-insensitive): "tariff" matches "tariffs". Avoid bare "united states" or
# "trade": they pull in every G7 communiqué and trade mission.
keywords = [
  "tariff", "countermeasure", "surtax", "remission", "cusma", "usmca", "duties",
  "trade action", "trade dispute", "trade war", "retaliat", "section 232",
  "steel", "aluminum", "softwood", "lumber",
]

[statcan_trade]
# Statistics Canada table 12-10-0011 (merchandise trade by principal partner, monthly).
partners = ["United States", "European Union", "All countries"]
months = 48

[fred_trade]
# US-side figures for the same flows. FRED ids: EXP/IMP + partner code (CA = Canada).
series = [
  { id = "EXPCA", label = "US exports of goods to Canada" },
  { id = "IMPCA", label = "US imports of goods from Canada" },
]

# ---------------------------------------------------------------------------
# How the website presents this topic. Series ids are "<adapter prefix>:<id>".

[site]
order = 1
tab = "US–Canada"
headline = "US–Canada trade, on the record"
lede = """Every US presidential action and Canadian government announcement on tariffs since January 2025, against both countries' official monthly trade figures. Each item links to the primary source. Nothing here is from news coverage."""

[[site.charts]]
label = "Canada's figures"
note = "Statistics Canada, Table 12-10-0011-01. CAD millions, balance-of-payments basis, seasonally adjusted."
views = [
  { label = "US", title = "Canada's trade with the United States", exports = "statcan:12100011:1.2.2.2.2.0.0.0.0.0", imports = "statcan:12100011:1.1.2.2.2.0.0.0.0.0" },
  { label = "EU", title = "Canada's trade with the European Union", exports = "statcan:12100011:1.2.2.2.3.0.0.0.0.0", imports = "statcan:12100011:1.1.2.2.3.0.0.0.0.0" },
  { label = "World", title = "Canada's trade with the world", exports = "statcan:12100011:1.2.2.2.1.0.0.0.0.0", imports = "statcan:12100011:1.1.2.2.1.0.0.0.0.0" },
]

[[site.charts]]
label = "US figures"
note = "US Census Bureau, republished on FRED. USD millions, not seasonally adjusted, so expect monthly swings."
views = [
  { label = "Canada", title = "US trade with Canada", exports = "fred:EXPCA", imports = "fred:IMPCA" },
]

[[site.markers]]
label = "US presidential action"
jurisdiction = "US"
doc_types = ["executive_order", "proclamation", "memorandum", "determination"]

[[site.markers]]
label = "Canadian government announcement"
jurisdiction = "CA"

[[site.filters]]
label = "All"

[[site.filters]]
label = "US actions"
jurisdiction = "US"

[[site.filters]]
label = "Canada statements"
jurisdiction = "CA"

[site.ask]
examples = [
  "What did the US do on Canadian steel and aluminum, and when did each step happen?",
  "Which US actions against Canada were later suspended or modified?",
  "What did Canada announce in response to the February 2025 US tariffs?",
  "How did US imports from Canada move in 2025, by both countries' figures?",
]
