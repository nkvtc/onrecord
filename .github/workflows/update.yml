# Daily: pull new government documents, archive them, publish the site. Costs $0.
#
# The archive (raw/ + manifest.jsonl) lives on the `data` branch, so its git history
# is a public, timestamped log of every official document we saw and every time one
# changed. The SQLite database is rebuilt from it on each run and shipped with the site.

name: Update data and site

on:
  schedule:
    - cron: "30 13 * * *" # 09:30 Eastern, after the Federal Register posts
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync

      - name: Check out the data archive
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git worktree add -B data data origin/data
          else
            git worktree add --orphan -b data data
            printf '*.sqlite\n' > data/.gitignore
          fi

      - run: uv run onrecord rebuild
      - name: Pull from government sources
        # A failing source is reported but must not block publishing the rest.
        run: uv run onrecord pull || echo "::warning::some sources failed, see log"
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
      - run: uv run onrecord status
      - run: uv run onrecord export --out build

      - name: Commit archive changes
        working-directory: data
        run: |
          git config user.name "onrecord-bot"
          git config user.email "onrecord-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new documents."
          else
            git commit -q -m "Archive $(date -u +%F): $(git diff --cached --numstat -- manifest.jsonl | cut -f1) new document versions"
            git push origin data
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
      - id: deploy
        uses: actions/deploy-pages@v4
